name: test_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  window_manager: ^0.5.0
  google_generative_ai: ^0.4.7
  flutter_math_fork: ^0.7.4
  gpt_markdown: ^1.1.2
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  iconsax: ^0.0.8
  langgraph: ^0.0.1-dev.2
  langchain: ^0.7.9
  langchain_google: ^0.6.5+2
  http: ^1.2.0
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/textures/
  fonts:
  
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
        
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode.ttf
      
