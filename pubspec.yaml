name: test_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  window_manager: ^0.5.0
  google_generative_ai: ^0.4.7
  flutter_math_fork: ^0.7.4
  gpt_markdown: ^1.1.2
  flutter_bloc: ^9.1.1
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/textures/
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
    - family: Vasir-Reg
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
      
